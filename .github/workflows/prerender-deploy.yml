name: Build, Prerender & Deploy Renovivo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-prerender:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Изтегляне на кода от GitHub
        uses: actions/checkout@v4

      - name: 2. Настройка на Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Инсталиране на пакетите и системните библиотеки за Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils
          npm ci

      - name: 4. Build + Puppeteer Prerender (37+ статични HTML страници + sitemap.xml + llms.txt)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: 5. Проверка на генерираните SEO/AI файлове
        run: |
          ls -la dist/
          head -n 25 dist/llms.txt
          head -n 25 dist/services/apartment-renovation/index.html

      - name: 6. Запазване на готовия статичен сайт (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: renovivo-static-dist
          path: dist/
