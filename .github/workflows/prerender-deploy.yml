name: Build & Verify SEO HTML — Renovivo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-prerender:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Изтегляне на кода от GitHub
        uses: actions/checkout@v4

      - name: 2. Настройка на Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 3. Инсталиране на пакетите
        run: npm ci

      - name: 4. Build + prerender static HTML
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: 5. Проверка на генерираните SEO/AI файлове
        run: |
          ls -la dist/
          head -n 25 dist/llms.txt
          head -n 25 dist/sitemap.xml
          test -s dist/services/apartment-renovation/index.html
          for id in 01 02 03 04 05; do test -s "dist/portfolio/apartment-$id/index.html"; done
          test -s dist/blog/osnoven-remont-apartament-sofia-ceni-2026/index.html
          node scripts/verify-prerender.mjs

      - name: 6. Запазване на готовия статичен сайт (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: renovivo-static-dist
          path: dist/
